<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETFLIX AUTO BYPASS — AFTAB</title>
<style>
body{background:#000;color:#39ff14;font-family:monospace;padding:20px;margin:0;min-height:100vh}
.box{background:#0a0a0a;border:3px solid #39ff14;border-radius:30px;padding:30px 20px;max-width:440px;margin:0 auto;text-align:center;box-shadow:0 0 20px #39ff14}
h1{font-size:24px;margin:0 0 20px 0;text-shadow:0 0 10px #39ff14}
.badge{background:#39ff14;color:#000;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin-top:8px}
.info{font-size:12px;margin:15px 0;border-bottom:1px solid #39ff14;padding-bottom:10px}
.box2{border:2px solid #ffcc00;border-radius:15px;padding:15px;margin:15px 0}
h2{font-size:14px;color:#ffcc00;margin:0 0 10px 0;text-align:left}
textarea{width:100%;height:80px;background:#000;border:1px solid #39ff14;border-radius:10px;color:#39ff14;padding:10px;font-size:12px;box-sizing:border-box;font-family:monospace}
button{background:#ffcc00;color:#000;border:none;border-radius:12px;padding:12px;width:100%;font-size:14px;font-weight:bold;cursor:pointer;margin-top:10px}
.gen{background:#39ff14;padding:16px;font-size:16px;border-radius:50px;box-shadow:0 0 20px #39ff14}
.count{border:2px solid #39ff14;border-radius:20px;padding:12px;margin:15px 0;font-size:13px}
#result{margin-top:10px;font-size:13px;font-weight:bold;padding:8px;border-radius:10px;display:none}
.ok{background:rgba(57,255,20,0.15);border:1px solid #39ff14;color:#39ff14;display:block!important}
.bad{background:rgba(255,0,0,0.15);border:1px solid #ff0000;color:#ff0000;display:block!important}
.footer{margin-top:25px;font-size:13px;font-weight:bold;color:#000;background:#39ff14;padding:6px 15px;border-radius:20px;display:inline-block;text-transform:uppercase;letter-spacing:2px}
</style>
</head>
<body>
<div class="box">
<h1>NETFLIX AUTO BYPASS PANEL<span class="badge">AFTAB</span></h1>
<div class="info">CORE: BYPASS // AUTO-INJECT // 4K // ALL DEVICES</div>

<div class="box2">
<h2>SINGLE COOKIE CHECKER</h2>
<textarea id="cookieInput" placeholder="paste netflix cookie here..."></textarea>
<button onclick="checkCookie()">CHECK COOKIE</button>
<div id="result"></div>
</div>

<div class="count">ACTIVE COOKIES: <span id="cnt">0</span></div>

<button class="gen" onclick="doBypass()">BYPASS &amp; OPEN NETFLIX</button>

<div style="margin-top:25px"><div class="footer">Made by Aftab</div></div>
</div>

<script>
function extractCookie(raw) {
  var parts = raw.split(/[;\n]/);
  var keep = ['netflixid','securenetflixid','nfvdid'];
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    var eq = p.indexOf('=');
    if (eq < 0) continue;
    var k = p.substring(0, eq).trim().toLowerCase();
    if (keep.indexOf(k) >= 0) out.push(p);
  }
  return out.join('; ');
}

async function checkCookie() {
  var input = document.getElementById('cookieInput').value.trim();
  var result = document.getElementById('result');
  if (!input) {
    result.className = 'bad';
    result.textContent = 'enter a cookie first';
    return;
  }
  var norm = extractCookie(input);
  if (!norm) {
    result.className = 'bad';
    result.textContent = 'no netflix cookie keys found';
    return;
  }
  result.className = '';
  result.style.display = 'block';
  result.style.background = 'rgba(255,204,0,0.1)';
  result.style.border = '1px solid #ffcc00';
  result.style.color = '#ffcc00';
  result.textContent = 'checking...';

  try {
    var res = await fetch('/api/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: norm, device: 'mobile' })
    });
    var data = await res.json();
    if (data.ok) {
      result.className = 'ok';
      result.innerHTML = 'LIVE COOKIE — profile: ' + (data.profile || 'unknown');
      document.getElementById('cnt').textContent = '1';
      localStorage.setItem('nfcookie', norm);
    } else {
      result.className = 'bad';
      result.textContent = 'DEAD — ' + (data.error || 'rejected');
    }
  } catch (e) {
    result.className = 'bad';
    result.textContent = 'request failed: ' + e.message;
  }
}

function doBypass() {
  var c = localStorage.getItem('nfcookie');
  if (!c) { alert('pehle cookie check karo'); return; }
  navigator.clipboard.writeText(c).then(function () {
    alert('cookie copied to clipboard. extension me paste karo.');
    window.open('https://www.netflix.com/browse', '_blank');
  }).catch(function () {
    alert('cookie: ' + c);
  });
}
</script>
</body>
</html>
